[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehn-basestation"
version = "0.1.0a0"
description = "Transport-neutral Emergency Ham Network basestation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ehn-basestation = "ehn_basestation.app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
