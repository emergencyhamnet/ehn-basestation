[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehn-basestation"
version = "0.1.0a0"
description = "Transport-neutral Emergency Ham Network basestation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
meshtastic = ["meshtastic==2.7.7", "protobuf>=7.36.2,<8"]
meshcore-usb = ["meshcore==2.3.15"]

[project.scripts]
ehn-basestation = "ehn_basestation.app.cli:main"
ehn-meshcore-usb-gateway = "ehn_basestation.gateways.meshcore.usb_gateway:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
